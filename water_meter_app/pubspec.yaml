name: water_meter_app
description: Cross-platform water consumption statistics app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  fl_chart: ^0.69.2
  go_router: ^14.6.2
  intl: ^0.19.0
  timezone: ^0.9.4
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  amplify_flutter: ^2.6.0
  amplify_auth_cognito: ^2.6.0
  network_info_plus: ^6.1.4
  permission_handler: ^11.4.0
  connectivity_plus: ^6.1.4
  app_settings: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
